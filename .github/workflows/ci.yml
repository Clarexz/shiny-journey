name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: lint, typecheck, pruebas y RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

      - name: Supabase local (migraciones y semilla)
        run: |
          npx supabase start
          npx supabase status -o env \
            | sed -n 's/^ANON_KEY="\(.*\)"$/SUPABASE_ANON_KEY=\1/p; s/^SERVICE_ROLE_KEY="\(.*\)"$/SUPABASE_SERVICE_ROLE_KEY=\1/p' \
            >> "$GITHUB_ENV"
          echo "SUPABASE_INTERNAL_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"

      - name: Verificación de RLS
        run: npm run check-rls

      - name: Pruebas (unitarias e integración)
        env:
          REDIS_URL: redis://127.0.0.1:6379/0
        run: npm test

      - name: Build de web y worker
        run: |
          npm run build -w @ravyn/web
          npm run build -w @ravyn/worker

      - name: Validar docker compose y deploy.sh
        run: |
          docker compose -f infra/docker-compose.dev.yml config --quiet
          for f in web worker evolution evolution-db; do
            cp "infra/env/$f.env.example" "infra/env/$f.env"
          done
          APP_VERSION=ci EVOLUTION_VERSION=ci EVO_BASIC_AUTH=ci EVO_IP_ALLOWLIST=127.0.0.1/32 \
            docker compose -f infra/docker-compose.yml config --quiet
          bash -n infra/scripts/deploy.sh
          infra/scripts/deploy.sh "${GITHUB_SHA}" --dry-run
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci

      - name: Parar Supabase
        if: always()
        run: npx supabase stop --no-backup || true

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buscar secretos en el historial
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner --verbose

  images:
    name: imagen ${{ matrix.app }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shiny-journey-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/shiny-journey-${{ matrix.app }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
